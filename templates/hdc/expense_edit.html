{% extends "base.html" %}
{% block title %}Edit Expense{% endblock %}
{% block page_heading %}Edit Expense{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2">
    <div class="col-md-7">
        <div class="card hdc-card">
            <div class="card-header hdc-card-header"><i class="fas fa-edit me-2"></i>Edit Expense</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control" value="{{ today }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Project *</label>
                        <select name="project_id" class="form-select" id="projSelect" required>
                            <option value="">- Select Project -</option>
                            {% for proj in projects %}
                            <option value="{{ proj.id }}" {% if exp.project_id == proj.id %}selected{% endif %}>{{ proj.name }} | {{ proj.project_code }} | {{ proj.client or 'No Owner' }} | {{ proj.location or 'No Location' }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stage *</label>
                        <select name="stage_id" class="form-select" id="stageSelect" required>
                            <option value="">Select Stage</option>
                            {% for proj in projects %}
                            {% for s in proj.stages %}
                            <option value="{{ s.id }}" data-project="{{ proj.id }}" {% if exp.stage_id == s.id %}selected{% endif %}>{{ s.name }}</option>
                            {% endfor %}
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label mb-0">Category *</label>
                            <a href="{{ url_for('hdc_expense_categories') }}" class="small text-decoration-none">Manage Categories</a>
                        </div>
                        <input type="text" class="form-control form-control-sm mb-1" id="expenseCategoryFilter" placeholder="Type to search category..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
                        <select name="category_id" class="form-select" id="expenseCategorySelect" required>
                            <option value="">Select Category</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if exp.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (PKR) *</label>
                        <input type="number" step="0.01" name="amount" class="form-control" value="{{ exp.amount or 0 }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Remarks</label>
                        <textarea name="remarks" class="form-control" rows="3">{{ exp.remarks or '' }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-mint"><i class="fas fa-save me-1"></i>Save Changes</button>
                        <a href="{{ url_for('hdc_expenses', project_id=exp.project_id) }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const projSel  = document.getElementById('projSelect');
const stageSel = document.getElementById('stageSelect');
function filterStages() {
    if (!projSel || !stageSel) return;
    const pid = projSel.value;
    Array.from(stageSel.options).forEach(opt => {
        if (!opt.value) return;
        const ok = (!pid || opt.dataset.project === pid);
        opt.style.display = ok ? '' : 'none';
        if (!ok && opt.selected) stageSel.value = '';
    });
}
if (projSel) {
    projSel.addEventListener('change', filterStages);
    filterStages();
}

if (window.HDCComboList) {
    window.HDCComboList.attach('expenseCategoryFilter', 'expenseCategorySelect', {
        includeEmpty: false
    });
}
</script>
{% endblock %}
