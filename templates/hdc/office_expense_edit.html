{% extends "base.html" %}
{% block title %}Edit Office Expense{% endblock %}
{% block page_heading %}Edit Office Expense{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2">
    <div class="col-md-6">
        <div class="card hdc-card">
            <div class="card-header hdc-card-header"><i class="fas fa-edit me-2"></i>Edit Office Expense</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control" value="{{ today }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category *</label>
                        <input type="text" name="category" class="form-control" value="{{ row.category or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (PKR) *</label>
                        <input type="number" step="0.01" min="0.01" name="amount" class="form-control" value="{{ row.amount or 0 }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Remarks</label>
                        <textarea name="remarks" class="form-control" rows="3">{{ row.remarks or '' }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-mint"><i class="fas fa-save me-1"></i>Save Changes</button>
                        <a href="{{ url_for('hdc_office_expenses') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
