{% extends "base.html" %}
{% block title %}Edit Office Ledger Entry{% endblock %}
{% block page_heading %}Edit Office Ledger Entry{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2">
    <div class="col-md-6">
        <div class="card hdc-card">
            <div class="card-header hdc-card-header"><i class="fas fa-edit me-2"></i>Edit {{ entry.entry_type|title }} Entry - {{ staff.name }}</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Date *</label>
                        <input type="date" name="date" class="form-control" value="{{ entry.date.isoformat() if entry.date else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (PKR) *</label>
                        <input type="number" step="0.01" min="0.01" name="amount" class="form-control" value="{{ entry.amount or 0 }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <input type="text" name="notes" class="form-control" value="{{ entry.notes or '' }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-mint"><i class="fas fa-save me-1"></i>Save</button>
                        <a href="{{ url_for('hdc_office_staff_ledger', sid=staff.id) }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
