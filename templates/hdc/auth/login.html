<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HDC ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/hdc_static/css/hdc.css">
    <script>
        (function(){
            var t = localStorage.getItem('hdc_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body class="login-body">
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <i class="fas fa-hard-hat fa-3x" style="color:var(--mint)"></i>
        </div>
        <div class="login-brand">
            <h2>HDC ERP</h2>
            <p>Hadi Design and Construction</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for cat, msg in messages %}
              <div class="alert alert-{{ cat }} py-2 small text-center">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('hdc_login') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text login-icon"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control login-input"
                           placeholder="Enter username" autocomplete="username" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text login-icon"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" id="loginPwd" class="form-control login-input"
                           placeholder="Enter password" autocomplete="current-password" required>
                    <button type="button" class="input-group-text login-icon" onclick="togglePwd()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-login w-100">
                <i class="fas fa-sign-in-alt me-2"></i>LOGIN
            </button>
        </form>
        <p class="login-hint">Use your assigned account credentials.</p>
    </div>
</div>

<script>
function togglePwd() {
    var input = document.getElementById('loginPwd');
    var icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye','fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash','fa-eye');
    }
}
</script>
</body>
</html>
