{% extends "shared/base.html" %}
{% block title %}Payroll{% endblock %}
{% block page_heading %}Payroll{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2">
    <div class="col-12 col-xl-10">
        <div class="text-center mb-3">
            <h5 class="mb-1"><i class="fas fa-money-check-dollar me-2 text-mint"></i>Payroll Control Center</h5>
            <p class="text-muted mb-0">Choose one action below.</p>
        </div>

        <div class="row g-3 justify-content-center">
            <div class="col-12 col-md-5">
                <a href="{{ url_for('hdc_payroll_generate') }}" class="text-decoration-none">
                    <div class="kpi-card kpi-green text-center">
                        <div class="kpi-icon"><i class="fas fa-gears"></i></div>
                        <div class="kpi-value">1</div>
                        <div class="kpi-label">Generate Payroll</div>
                    </div>
                </a>
            </div>
            <div class="col-12 col-md-5">
                <a href="{{ url_for('hdc_payroll_salary_cards_page') }}" class="text-decoration-none">
                    <div class="kpi-card kpi-red text-center">
                        <div class="kpi-icon"><i class="fas fa-id-card"></i></div>
                        <div class="kpi-value">2</div>
                        <div class="kpi-label">Salary Cards</div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
