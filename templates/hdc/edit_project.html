{% extends "base.html" %}
{% block title %}Edit Project{% endblock %}
{% block page_heading %}Edit: {{ p.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2">
<div class="col-md-8 col-lg-7">
<div class="card hdc-card">
    <div class="card-header hdc-card-header"><i class="fas fa-edit me-2"></i>Edit Project</div>
    <div class="card-body">
        <form method="POST">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Project Code</label>
                <input type="text" class="form-control" value="{{ p.project_code }}" disabled>
            </div>
            <div class="col-md-8">
                <label class="form-label">Project Name</label>
                <input type="text" class="form-control" value="{{ p.name }}" disabled>
                <input type="hidden" name="name" value="{{ p.name }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Client / Owner Name</label>
                <input type="text" name="client" class="form-control" value="{{ p.client or '' }}" placeholder="e.g. Mr. Ahmed Khan">
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone Number</label>
                <input type="text" name="client_phone" class="form-control" value="{{ p.client_phone or '' }}" placeholder="e.g. 03XXXXXXXXX">
            </div>
            <div class="col-md-6">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" value="{{ p.location or '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Contract Type</label>
                <select name="contract_type" class="form-select">
                    <option value="sqft" {% if p.contract_type=='sqft' %}selected{% endif %}>Per Sq Ft</option>
                    <option value="lump_sum" {% if p.contract_type=='lump_sum' %}selected{% endif %}>Lump Sum</option>
                    <option value="mixed" {% if p.contract_type=='mixed' %}selected{% endif %}>Mixed</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Total Sq Ft</label>
                <input type="number" step="0.01" name="total_sqft" class="form-control" value="{{ p.total_constructed_sqft }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Rate per Sq Ft</label>
                <input type="number" step="0.01" name="owner_rate" class="form-control" value="{{ p.owner_rate_per_sqft }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Lump Sum Amount</label>
                <input type="number" step="0.01" name="lump_sum" class="form-control" value="{{ p.owner_lump_sum }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Planned End</label>
                <input type="date" name="planned_end" class="form-control" value="{{ p.planned_end or '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="planned" {% if p.status=='planned' %}selected{% endif %}>planned</option>
                    <option value="active" {% if p.status=='active' or p.status=='Active' %}selected{% endif %}>active</option>
                    <option value="paused" {% if p.status=='paused' %}selected{% endif %}>paused</option>
                    <option value="completed" {% if p.status=='completed' or p.status=='Completed' %}selected{% endif %}>completed</option>
                    
                </select>
            </div>
        </div>
        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-mint"><i class="fas fa-save me-1"></i>Update</button>
            <a href="{{ url_for('hdc_project_detail', pid=p.id) }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
