name: HDC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HDC_ENV: test
      HDC_SECRET_KEY: ci-only-secret
      HDC_BOOTSTRAP_ADMIN_PASSWORD: Admin@1234
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q hdc hdc_erp.py wsgi.py deploy_hook.py wsgi_dispatch_snippet.py scripts tests ops

      - name: Check module layers
        run: python scripts/check_layers.py

      - name: Ensure databases and archives stay out of Git
        run: python scripts/check_db_safety.py

      - name: Deploy automation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check frontend organization
        run: python scripts/reorganize_frontend.py --check

      - name: Check the adaptive/responsive layer
        run: python scripts/qa_responsive.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript
        shell: bash
        run: find static -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Run fresh-database smoke flow
        run: |
          python tests/smoke_worker.py \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/hdc-ci.db" \
            "$RUNNER_TEMP/hdc-ci-instance" \
            "$RUNNER_TEMP/hdc-ci-smoke.json"

      - name: Verify runtime inventory and financial acceptance
        run: |
          python scripts/qa_inventory.py --output "$RUNNER_TEMP/hdc-inventory.json"
          python scripts/audit_acceptance.py --json "$RUNNER_TEMP/hdc-acceptance.json"
          python -c "import json, os; r=json.load(open(os.environ['RUNNER_TEMP']+'/hdc-ci-smoke.json')); assert not r['errors'], r['errors']; assert all(v < 500 for v in r['reads'].values()), r['reads']"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test browser and application
        run: |
          python -m pip install -r requirements.txt playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Real browser release checks (owns disposable server and database)
        run: python scripts/qa_browser.py --output browser-evidence.json
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: browser-evidence.json
