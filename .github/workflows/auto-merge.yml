name: Auto-merge PRs

# Rule: when a pull request is opened against main, merge it automatically
# and delete the temporary source branch after the merge.
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only PRs targeting main, not drafts, and only same-repo branches
    # (temp arena/* work branches). Fork PRs still need a human.
    if: >
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Merge PR automatically and delete temp branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Enable auto-merge (merges as soon as requirements are met)
          # and delete the temp branch after merge. If auto-merge cannot be
          # enabled, fall back to merging right away — either way the PR is
          # merged automatically and the temp branch is deleted.
          gh pr merge --auto --merge --delete-branch "$PR_URL" \
            || gh pr merge --merge --delete-branch "$PR_URL"
